<div
  class="segmented-control"
  role="radiogroup"
  aria-label="Risk Level Selection"
  [class.segmented-control--disabled]="isDisabled()"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="value() === option.value"
      class="segmented-control__btn"
      [class.segmented-control__btn--active]="value() === option.value"
      (click)="selectOption(option.value)"
      [disabled]="isDisabled()"
    >
      {{ option.label }}
    </button>
  }
</div>
